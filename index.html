<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未來世界通訊終端</title>
<link rel="stylesheet" href="chat.css">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

<div class="device">
  <div class="screen-header">
    <div class="signal-dots">
      <div class="signal-dot" style="height:6px"></div>
      <div class="signal-dot" style="height:9px"></div>
      <div class="signal-dot" style="height:12px"></div>
      <div class="signal-dot" style="height:9px;opacity:0.4"></div>
    </div>
    <div class="screen-title">通訊終端</div>
    <div style="width:60px"></div>
  </div>

  <!-- 首頁 -->
  <div class="phase-home" id="phaseHome">
    <div class="contact-card">
      <div class="contact-avatar-group">
        <div class="avatar avatar-weng">
          <img src="oldman-白背景.png" alt="翁" class="avatar-img" onerror="this.style.display='none';this.parentNode.innerHTML='翁'">
        </div>
      </div>
      <div class="contact-info">
        <div class="contact-name">老翁</div>
        <div class="contact-status"><span class="online-dot"></span>訊號連線中</div>
      </div>
    </div>
    <div class="start-area">
      <p class="start-desc">你可以詢問老翁關於自然、宇宙、生命的事。</p>
      <button class="start-btn" id="startBtn">開始對話</button>
    </div>
  </div>

  <!-- 對話頁 -->
  <div class="phase-chat" id="phaseChat">
    <div class="chat-topbar">
      <button class="back-btn" id="backBtn" aria-label="返回">&#8592;</button>
      <div class="chat-contact-info">
        <div class="chat-contact-name">老翁</div>
        <div class="chat-status"><span class="online-dot"></span>通訊中</div>
      </div>
      <div class="chat-signal">
        <span style="height:4px"></span>
        <span style="height:7px"></span>
        <span style="height:10px"></span>
        <span style="height:7px;opacity:0.4"></span>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="divider-line"></div>

    <div class="input-area">
      <input type="text" id="userInput" class="user-input" placeholder="輸入訊息…" autocomplete="off">
      <button class="send-btn" id="sendBtn">發送</button>
    </div>
  </div>

  <div class="screen-footer">
    <div class="footer-dot active" id="dot1"></div>
    <div class="footer-dot" id="dot2"></div>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
